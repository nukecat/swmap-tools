[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swmap-tools"
version = "0.2.0"
description = "Read, write, unpack and pack .swmap custom map files"
requires-python = ">=3.9"
dependencies = ["numpy", "pillow"]

[project.scripts]
swmap = "swmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
